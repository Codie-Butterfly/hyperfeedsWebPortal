# Host Nginx template: inspect existing listeners and virtual hosts before installing.
# Issue the certificate before enabling the TLS server block.
server {
    listen 80;
    server_name 62.171.128.245;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 301 https://62.171.128.245$request_uri; }
}

server {
    listen 443 ssl;
    server_name 62.171.128.245;
    ssl_certificate /etc/letsencrypt/live/62.171.128.245/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/62.171.128.245/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
