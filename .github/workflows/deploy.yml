name: Build and deploy Hyperfeeds web portal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hyperfeeds-web-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.41.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --release --pwa-strategy=none
      - uses: actions/upload-artifact@v4
        with:
          name: portal-web
          path: build/web
      - uses: docker/login-action@v3
        if: vars.DEPLOY_ENABLED != 'false'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        if: vars.DEPLOY_ENABLED != 'false'
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/hyperfeeds-web-portal:${{ github.sha }}
  deploy:
    if: vars.DEPLOY_ENABLED != 'false'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Deploy portal
        env:
          SSHPASS: ${{ secrets.SCP_PASSWORD }}
          SSH_USER: ${{ secrets.SCP_USERNAME }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/hyperfeeds-web-portal:${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s' "$DOCKER_PASSWORD" | sshpass -e ssh "$SSH_USER@$SERVER_IP" "sudo docker login -u '$DOCKER_USER' --password-stdin"
          sshpass -e ssh "$SSH_USER@$SERVER_IP" "set -e;
            sudo docker network inspect hyperfeeds-network >/dev/null;
            sudo docker pull '$IMAGE';
            sudo docker rm -f hyperfeeds-web-portal >/dev/null 2>&1 || true;
            sudo docker run -d --name hyperfeeds-web-portal --restart unless-stopped --network hyperfeeds-network -p 127.0.0.1:8091:80 '$IMAGE';
            for attempt in 1 2 3 4 5 6; do
              if curl -fsS http://127.0.0.1:8091/healthz && curl -fsS http://127.0.0.1:8091/api/actuator/health; then exit 0; fi;
              sleep 10;
            done;
            sudo docker logs --tail 50 hyperfeeds-web-portal; exit 1"
